[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# internal
rslook-mail = { path = "crates/mail" }
rslook-engine = { path = "crates/engine" }
rslook-ui-egui = { path = "crates/ui-egui" }
rslook-account = { path = "crates/account" }
rslook-imap = { path = "crates/imap" }
rslook-smtp = { path = "crates/smtp" }
rslook-sync = { path = "crates/sync" }
rslook-msg = { path = "crates/msg" }
rslook-pst = { path = "crates/pst" }
rslook-oauth = { path = "crates/oauth" }
rslook-graph = { path = "crates/graph" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }

# mail formats: RFC 5322 / MIME parsing (Apache-2.0 OR MIT)
mail-parser = "0.11"
# Outlook files (MIT): .pst through Microsoft's [MS-PST] reader; .msg is our own [MS-OXMSG]
# reader on the generic compound-file container.
outlook-pst = "1.2"
cfb = "0.15"

# accounts and sync (all MIT and/or Apache-2.0)
# OS keychain: Secret Service (zbus, pure Rust) on Linux, Credential Manager on Windows.
keyring = "4.2"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring", "hostname"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
futures = "0.3"
# Microsoft 365 sign-in (OAuth 2.0 + PKCE) and Microsoft Graph (all MIT and/or Apache-2.0).
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
getrandom = "0.4"
sha2 = "0.11"
base64 = "0.23"
webbrowser = "1.2"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
